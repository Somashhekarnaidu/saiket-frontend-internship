<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Card | Task 2</title>
  <style>
    :root{--ink:#1d2433;--muted:#667085;--accent:#0b6e4f;--accent-dark:#084c37;--bg:#eef2ee;--card:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);padding:1rem}
    .card{width:100%;max-width:300px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(20,40,30,.12);transition:transform .25s,box-shadow .25s}
    .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,40,30,.18)}
    .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#dfe9e3}
    .body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.5rem}
    .name{margin:0;font-size:1.15rem}
    .desc{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}
    .price{font-size:1.4rem;font-weight:700;margin:.3rem 0 .6rem}
    .btn{border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 1rem inherit;padding:.75rem 1rem;cursor:pointer;width:100%;transition:background .2s,transform .1s}
    .btn:hover{background:var(--accent-dark)}
    .btn:active{transform:scale(.97)}
    .btn:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
  </style>
</head>
<body>
  <article class="card">
    <img alt="Green ceramic travel mug"
         src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23dfe9e3'/%3E%3Cpath d='M120 90h130v120a30 30 0 0 1-30 30h-70a30 30 0 0 1-30-30z' fill='%230b6e4f'/%3E%3Cpath d='M250 115h25a28 28 0 0 1 0 56h-25' fill='none' stroke='%230b6e4f' stroke-width='16'/%3E%3Crect x='112' y='76' width='146' height='20' rx='8' fill='%23084c37'/%3E%3Cpath d='M160 50q10-20 0-30M190 50q10-20 0-30M220 50q10-20 0-30' stroke='%2399aaa0' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <div class="body">
      <h2 class="name">Trail Ceramic Mug</h2>
      <p class="desc">350 ml insulated mug that keeps drinks hot for 4 hours.</p>
      <div class="price">&#8377;899</div>
      <button class="btn" type="button" id="add">Add to Cart</button>
    </div>
  </article>
  <script>
    // Small bonus: feedback when the button is clicked
    const b=document.getElementById('add');
    b.addEventListener('click',()=>{b.textContent='Added \u2713';setTimeout(()=>b.textContent='Add to Cart',1500)});
  </script>
</body>
</html>
