<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List | Task 5</title>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--accent:#0f766e;--accent-d:#115e59;--danger:#b91c1c;--line:#e2e8f0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:1rem}
    .app{max-width:560px;margin:2rem auto;background:var(--card);border-radius:14px;padding:1.4rem;box-shadow:0 8px 24px rgba(15,23,42,.08)}
    h1{margin:0 0 1rem;font-size:1.5rem}
    .add{display:flex;gap:.5rem}
    input[type=text]{flex:1;min-width:0;padding:.65rem .8rem;border:2px solid var(--line);border-radius:8px;font-size:1rem}
    input[type=text]:focus{outline:none;border-color:var(--accent)}
    button{border:0;border-radius:8px;padding:.6rem .9rem;font-size:.9rem;cursor:pointer;background:var(--accent);color:#fff}
    button:hover{background:var(--accent-d)}
    button.ghost{background:#e2e8f0;color:var(--ink)}
    button.ghost:hover{background:#cbd5e1}
    button.del{background:var(--danger)}
    button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
    ul{list-style:none;padding:0;margin:1rem 0 0}
    li{display:flex;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
    li span{flex:1;overflow-wrap:anywhere}
    li.done span{text-decoration:line-through;color:var(--muted)}
    li input[type=checkbox]{width:1.2rem;height:1.2rem;accent-color:var(--accent)}
    .actions{display:flex;gap:.4rem}
    .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:.8rem}
    .empty{color:var(--muted);text-align:center;padding:1.2rem 0}
    #msg{color:var(--danger);font-size:.85rem;min-height:1.2rem;margin:.4rem 0 0}
    @media (max-width:480px){
      .app{margin:.5rem auto;padding:1rem}
      li{flex-wrap:wrap}
      .actions{width:100%;justify-content:flex-end}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <form class="add" id="addForm">
      <input type="text" id="newTask" placeholder="What needs to be done?" aria-label="New task" maxlength="120" autocomplete="off">
      <button type="submit">Add task</button>
    </form>
    <p id="msg" role="alert"></p>
    <ul id="list"></ul>
    <div class="meta"><span id="count"></span><button class="ghost" id="clear" type="button">Clear completed</button></div>
  </main>

  <script>
    const KEY = 'saiket-todos';
    let todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ todos = []; }
    let editingId = null;
    const list = document.getElementById('list'), msg = document.getElementById('msg');

    const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(todos)); }catch(e){} };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

    function render(){
      list.innerHTML = '';
      if(!todos.length){ list.innerHTML = '<li class="empty">No tasks yet. Add your first one above.</li>'; }
      todos.forEach(t => {
        const li = document.createElement('li');
        if(t.done) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = t.done; cb.setAttribute('aria-label','Mark complete');
        cb.onchange = () => { t.done = cb.checked; save(); render(); };
        li.append(cb);

        if(editingId === t.id){
          const input = document.createElement('input');
          input.type = 'text'; input.value = t.text; input.maxLength = 120;
          const ok = document.createElement('button'); ok.textContent = 'Save';
          const commit = () => {
            const v = input.value.trim();
            if(!v){ msg.textContent = 'Task cannot be empty.'; return; }
            t.text = v; editingId = null; msg.textContent = ''; save(); render();
          };
          ok.onclick = commit;
          input.onkeydown = e => { if(e.key==='Enter') commit(); if(e.key==='Escape'){ editingId=null; render(); } };
          li.append(input, ok);
          setTimeout(() => input.focus());
        } else {
          const span = document.createElement('span'); span.textContent = t.text;   // safe against XSS
          const box = document.createElement('div'); box.className = 'actions';
          const edit = document.createElement('button'); edit.className='ghost'; edit.textContent='Edit';
          edit.onclick = () => { editingId = t.id; render(); };
          const del = document.createElement('button'); del.className='del'; del.textContent='Delete';
          del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };
          box.append(edit, del);
          li.append(span, box);
        }
        list.append(li);
      });
      const left = todos.filter(t => !t.done).length;
      document.getElementById('count').textContent = `${left} task${left===1?'':'s'} left`;
    }

    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('newTask');
      const text = input.value.trim();
      if(!text){ msg.textContent = 'Please type a task first.'; return; }
      todos.push({id: uid(), text, done:false});
      input.value = ''; msg.textContent = ''; save(); render();
    });
    document.getElementById('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
    render();
  </script>
</body>
</html>
